<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="DevOps engineer dashboard banner">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73bf69"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .panel{fill:#181b1f;stroke:#2c3235;stroke-width:1}
    .ttl{fill:#9fa7b3;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .big{fill:#73bf69;font-size:34px;font-weight:700}
    .big2{fill:#5794f2;font-size:34px;font-weight:700}
    .big3{fill:#f5a623;font-size:34px;font-weight:700}
    .sm{fill:#6e7681;font-size:11px}
    .name{fill:#e6e9ef;font-size:26px;font-weight:700}
    .role{fill:#9fa7b3;font-size:13px}
    .svc{fill:#c7d0d9;font-size:12px}
  </style>

  <rect width="900" height="340" rx="10" fill="#111217"/>

  <!-- header -->
  <rect class="panel" x="12" y="12" width="876" height="64" rx="6"/>
  <circle cx="38" cy="44" r="7" fill="#73bf69"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="56" y="40" class="name">YOUR NAME</text>
  <text x="56" y="60" class="role">DevOps · Platform · SRE &#160;|&#160; Kubernetes · Terraform · CI/CD · Observability</text>
  <text x="870" y="50" class="sm" text-anchor="end">Last 24h  ⟳ auto-refresh</text>

  <!-- stat panels -->
  <rect class="panel" x="12" y="88" width="210" height="96" rx="6"/>
  <text x="26" y="108" class="ttl">Uptime (SLO)</text>
  <text x="26" y="150" class="big">99.99%</text>
  <text x="26" y="170" class="sm">error budget healthy</text>

  <rect class="panel" x="234" y="88" width="210" height="96" rx="6"/>
  <text x="248" y="108" class="ttl">Deploys / day</text>
  <text x="248" y="150" class="big2">12+</text>
  <text x="248" y="170" class="sm">zero-downtime rollouts</text>

  <rect class="panel" x="456" y="88" width="210" height="96" rx="6"/>
  <text x="470" y="108" class="ttl">MTTR</text>
  <text x="470" y="150" class="big3">&lt; 15 min</text>
  <text x="470" y="170" class="sm">auto-rollback enabled</text>

  <rect class="panel" x="678" y="88" width="210" height="96" rx="6"/>
  <text x="692" y="108" class="ttl">Pipeline health</text>
  <rect x="692" y="124" width="182" height="10" rx="5" fill="#2c3235"/>
  <rect x="692" y="124" width="0" height="10" rx="5" fill="url(#bar)">
    <animate attributeName="width" from="0" to="176" dur="2s" fill="freeze"/>
  </rect>
  <text x="692" y="158" class="sm">build ▸ test ▸ scan ▸ deploy</text>
  <text x="692" y="174" class="svc" style="fill:#73bf69">● all stages passing</text>

  <!-- graph panel -->
  <rect class="panel" x="12" y="196" width="560" height="132" rx="6"/>
  <text x="26" y="216" class="ttl">Delivery throughput</text>
  <g stroke="#23272b" stroke-width="1">
    <line x1="26" y1="240" x2="558" y2="240"/><line x1="26" y1="266" x2="558" y2="266"/>
    <line x1="26" y1="292" x2="558" y2="292"/><line x1="26" y1="318" x2="558" y2="318"/>
  </g>
  <path d="M26 300 L90 280 L150 288 L210 262 L270 270 L330 240 L390 252 L450 228 L510 236 L558 222 L558 318 L26 318 Z" fill="url(#area)"/>
  <path d="M26 300 L90 280 L150 288 L210 262 L270 270 L330 240 L390 252 L450 228 L510 236 L558 222"
        fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linejoin="round"
        stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="2.5s" fill="freeze"/>
  </path>
  <circle cx="558" cy="222" r="4" fill="#f5a623">
    <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- services panel -->
  <rect class="panel" x="584" y="196" width="304" height="132" rx="6"/>
  <text x="598" y="216" class="ttl">Service status</text>
  <g>
    <circle cx="600" cy="240" r="5" fill="#73bf69"/><text x="614" y="244" class="svc">kubernetes-cluster</text><text x="874" y="244" class="sm" text-anchor="end">healthy</text>
    <circle cx="600" cy="264" r="5" fill="#73bf69"/><text x="614" y="268" class="svc">terraform-state</text><text x="874" y="268" class="sm" text-anchor="end">in sync</text>
    <circle cx="600" cy="288" r="5" fill="#73bf69"/><text x="614" y="292" class="svc">ci-cd-pipeline</text><text x="874" y="292" class="sm" text-anchor="end">passing</text>
    <circle cx="600" cy="312" r="5" fill="#f5a623"><animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="614" y="316" class="svc">learning-new-tools</text><text x="874" y="316" class="sm" text-anchor="end">in progress</text>
  </g>
</svg>
